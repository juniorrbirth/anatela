    const DAILY_MARKS = ['·','✦','✧','★','☆','❖','⁕','✺','❋','✹'];
    function saoPauloDate(value) {
      return new Intl.DateTimeFormat('en-CA', { timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date(value));
    }
    function getReward(row) {
      const start = row.reward_started_at || row.created_at || new Date().toISOString();
      const startDate = saoPauloDate(start).split('-').map(Number);
      const todayDate = saoPauloDate(new Date()).split('-').map(Number);
      const startUtc = Date.UTC(startDate[0], startDate[1]-1, startDate[2]);
      const todayUtc = Date.UTC(todayDate[0], todayDate[1]-1, todayDate[2]);
      const day = Math.max(1, Math.min(100, Math.floor((todayUtc-startUtc)/86400000)+1));
      const tier = Math.min(9, Math.floor((day-1)/10));
      const style = TIER_DECORATIONS[tier];
      const mark = DAILY_MARKS[(day-1)%DAILY_MARKS.length];
      const left = day === 1 ? '' : (tier === 0 ? mark + ' ' : style.left + mark);
      const right = day === 1 ? '' : (tier === 0 ? ' ' + mark : mark + style.right);
      const title = day === 100 ? 'Lenda Suprema' : (day === 1 ? 'Iniciante' : style.title);
      return { day, left, right, title, tip: HEALTH_TIPS[day-1] };
    }

    function getDecorations(key) { return decorationsByName.get(key) || []; }

    function renderName(row) {
      const username = row.username;
      const key = (row.username_normalized || username.toLowerCase()).toLowerCase();
      const state = nameElements.get(key);
      if (!state) return;
      const verified = row.is_verified === true;
      const oldEl = state.el;

      newEl.className = 'moving-name';

      if (verified) {
        newEl.href = 'https://www.instagram.com/' + encodeURIComponent(username) + '/';
        newEl.target = '_blank';
        newEl.rel = 'noopener noreferrer';
        newEl.title = 'Abrir perfil autorizado no Instagram';
      }
      const nameText = document.createElement('span');
      nameText.className = 'name-text';
      const reward = getReward(row);
      nameText.textContent = reward.left + '@' + username + reward.right;
      newEl.appendChild(nameText);
      const decoration = document.createElement('span');
      decoration.className = 'name-decoration';
      const effects = getDecorations(key);
      const colors = effects.filter(e => e.effect_type === 'color');
      const emojis = effects.filter(e => e.effect_type === 'emoji');
      if (colors.length) nameText.style.color = colors[colors.length - 1].effect_value;
      if (effects.some(e => e.effect_type === 'bold')) nameText.style.fontWeight = '700';
      if (effects.some(e => e.effect_type === 'underline')) nameText.style.textDecoration = 'underline';
      decoration.textContent = emojis.map(e => e.effect_value).join('');
      newEl.appendChild(decoration);
      newEl.style.transform = oldEl.style.transform || '';
      oldEl.replaceWith(newEl);
      state.el = newEl;
      const tag = tags.get(key);
      if (tag) tag.el = newEl;
    }

    function addName(row) {
      if (!row || !row.username) return;
      const key = (row.username_normalized || row.username.toLowerCase()).toLowerCase();
      if (tags.has(key)) {
        const state = nameElements.get(key);
        if (state) { state.row = { ...state.row, ...row }; renderName(state.row); }

      const el = document.createElement('span');

      const maxX = Math.max(0, innerWidth - el.offsetWidth);
      const maxY = Math.max(0, innerHeight - el.offsetHeight);
      const angle = Math.random() * Math.PI * 2;
      const speed = 55 + Math.random() * 90;
      tags.set(key, { el, x: Math.random() * maxX, y: Math.random() * maxY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed });
      renderName(row);
    }

    async function loadDecorations() {
      const { data, error: readError } = await supabaseClient.from(DECORATION_TABLE).select('username_normalized,effect_type,effect_value').limit(5000);
      if (readError) throw new Error('Não consegui carregar os detalhes dos nomes. Confira se a tabela de detalhes diários foi criada no Supabase.');
      decorationsByName.clear();
      (data || []).forEach(d => {
        const key = d.username_normalized.toLowerCase();
        if (!decorationsByName.has(key)) decorationsByName.set(key, []);
        decorationsByName.get(key).push(d);
      });
    }

    async function addDailyDecoration(usernameNormalized) {
      const visitorId = (() => {
        const key = 'atnatela_visitor_id_v1';
        let id = localStorage.getItem(key);
        if (!id) {
          id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'v-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
          localStorage.setItem(key, id);
        }
        return id;
      })();
      const { error: rpcError } = await supabaseClient.rpc('add_daily_decoration', { p_username_normalized: usernameNormalized, p_visitor_id: visitorId });
      if (rpcError) throw new Error('O nome foi enviado, mas o detalhe diário não pôde ser aplicado.');
      const { data, error: readError } = await supabaseClient.from(DECORATION_TABLE).select('username_normalized,effect_type,effect_value').eq('username_normalized', usernameNormalized);
      if (readError) throw new Error('Não consegui atualizar os detalhes do nome.');
      decorationsByName.set(usernameNormalized, data || []);
      const state = nameElements.get(usernameNormalized);
      if (state) renderName(state.row);
    }

    async function startSharedScreen() {
      if (started) return;
      setupSupabase();
      showError('Carregando…');
      const { data, error: readError } = await supabaseClient.from(TABLE)
        .select('username,username_normalized,is_verified,created_at,reward_started_at').order('created_at', { ascending: true }).limit(500);
      if (readError) throw new Error('Não consegui ler os nomes. Confira as políticas RLS e a tabela instagram_names. Detalhe: ' + (readError.message || readError.code || 'erro desconhecido'));
      await loadDecorations();
      playfield.replaceChildren();
      tags.clear(); nameElements.clear();
      (data || []).forEach(addName);
      entry.style.display = 'none';
      playfield.style.display = 'block';
      verifyPanel.style.display = 'flex';
      started = true;
      requestAnimationFrame(animate);

      supabaseClient.channel('public-atnatela-updates')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: TABLE }, payload => addName(payload.new))
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: TABLE }, payload => addName(payload.new))
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: DECORATION_TABLE }, payload => {
          const d = payload.new, key = d.username_normalized.toLowerCase();
          const list = getDecorations(key).slice();
          if (!list.some(x => x.effect_type === d.effect_type && x.effect_value === d.effect_value && x.username_normalized === d.username_normalized && x.created_at === d.created_at)) list.push(d);
          decorationsByName.set(key, list);
          const state = nameElements.get(key);
          if (state) renderName(state.row);
        })
        .subscribe();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = cleanUsername(input.value);
      if (!validUsername(username)) { showError('Digite um @ válido: letras, números, ponto ou sublinhado.'); input.focus(); return; }
      submit.disabled = true;
      showError('Salvando…');
      try {
        setupSupabase();
        const normalized = username.toLowerCase();
        const { error: insertError } = await supabaseClient.from(TABLE).insert({ username, username_normalized: normalized });
        if (insertError && insertError.code !== '23505') throw new Error('Não consegui salvar no banco: ' + (insertError.message || insertError.code || 'erro desconhecido'));
        await startSharedScreen();
        try { await addDailyDecoration(normalized); }
        catch (decorationError) { console.warn(decorationError); showError(decorationError.message); }
      const rewardRow = nameElements.get(normalized)?.row;
      if (rewardRow) showDailyReward(rewardRow);
      } catch (e) {
        console.error(e);
        showError(e.message || 'Não foi possível salvar. Verifique a conexão e as configurações do Supabase.');
      } finally { submit.disabled = false; }
    });

    verifyButton.addEventListener('click', () => {
      requestForm.reset();
      requestUsername.disabled = false; requestEmail.disabled = false;
      requestConfirm.style.display = ''; requestConfirm.disabled = false;
      otpArea.style.display = 'none'; verifyOtpButton.style.display = ''; verifyOtpButton.disabled = false; requestOtp.style.display = '';
      pendingVerification = null;
      requestMessage.textContent = '';
      requestBackdrop.style.display = 'flex';
      requestUsername.focus();
    });

    requestCancel.addEventListener('click', () => {
      requestBackdrop.style.display = 'none';
      pendingVerification = null;
    });

    requestBackdrop.addEventListener('click', (event) => {
      if (event.target === requestBackdrop) requestBackdrop.style.display = 'none';
    });

    requestForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = cleanUsername(requestUsername.value);
      const email = requestEmail.value.trim().toLowerCase();
      if (!validUsername(username)) {
        requestMessage.textContent = 'Digite um @ válido: letras, números, ponto ou sublinhado.';
        requestUsername.focus(); return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        requestMessage.textContent = 'Digite um endereço de e-mail válido.';
        requestEmail.focus(); return;
      }
      requestConfirm.disabled = true;
      requestMessage.textContent = 'Registrando pedido e enviando código…';
      try {
        setupSupabase();
        const normalized = username.toLowerCase();
        const { error: requestError } = await supabaseClient
          .from(VERIFICATION_REQUESTS_TABLE)
          .insert({ username, email });
        if (requestError) throw new Error('Não foi possível registrar o pedido. Confira se executou o SQL de confirmação por e-mail no Supabase. Detalhe: ' + (requestError.message || requestError.code || 'erro desconhecido'));
        const { error: emailError } = await supabaseClient.auth.signInWithOtp({
          email,
          options: { shouldCreateUser: true }
        });
        if (emailError) throw new Error('O pedido foi registrado, mas o código não pôde ser enviado. Confira o modelo de e-mail OTP e a configuração de e-mail do Supabase. Detalhe: ' + (emailError.message || emailError.code || 'erro desconhecido'));
        pendingVerification = { username: normalized, email };
        requestUsername.disabled = true;
        requestEmail.disabled = true;
        requestConfirm.style.display = 'none';
        otpArea.style.display = 'block';
        requestOtp.value = '';
        requestOtp.focus();
        requestMessage.textContent = 'Código enviado! Digite os 6 dígitos recebidos. Se não chegar, confira spam e solicite um novo código.';
      } catch (e) {
        console.error(e);
        requestMessage.textContent = e.message || 'Não foi possível enviar o código.';
      } finally { requestConfirm.disabled = false; }
    });

    verifyOtpButton.addEventListener('click', async () => {
      const token = requestOtp.value.trim();
      if (!pendingVerification) {
        requestMessage.textContent = 'Solicite um código primeiro.';
        return;
      }
      if (!/^\d{6}$/.test(token)) {
        requestMessage.textContent = 'Digite o código de 6 dígitos recebido por e-mail.';
        requestOtp.focus(); return;
      }
      verifyOtpButton.disabled = true;
      requestMessage.textContent = 'Validando código…';
      try {
        setupSupabase();
        const { data: authData, error: otpError } = await supabaseClient.auth.verifyOtp({
          email: pendingVerification.email,
          token,
          type: 'email'
        });
        if (otpError || !authData?.session?.user?.email) {
          throw new Error('Código inválido ou expirado. Solicite um novo código e use o mais recente.');
        }
        const email = authData.session.user.email.toLowerCase();
        const { data: approvedRows, error: approveError } = await supabaseClient
          .from(VERIFICATION_REQUESTS_TABLE)
          .update({ status: 'approved' })
          .eq('username_normalized', pendingVerification.username)
          .eq('email', email)
          .eq('status', 'pending')
          .select('id');
        if (approveError) throw new Error('E-mail confirmado, mas o @ não foi liberado. Confira o SQL e as permissões no Supabase. Detalhe: ' + (approveError.message || approveError.code || 'erro desconhecido'));
        if (!approvedRows || approvedRows.length === 0) {
          throw new Error('O e-mail foi confirmado, mas não encontrei um pedido pendente correspondente. Feche esta janela e faça uma nova solicitação para o mesmo @ e e-mail.');
        }
        requestMessage.textContent = 'E-mail confirmado! Se o @ já estiver cadastrado na tela, ele agora poderá ser clicável. Atualize a página para ver a mudança.';
        verifyOtpButton.style.display = 'none';
        requestOtp.style.display = 'none';
        pendingVerification = null;
      } catch (e) {
        console.error(e);
        requestMessage.textContent = e.message || 'Não foi possível confirmar o código.';
      } finally { verifyOtpButton.disabled = false; }
    });

    function animate(time) {
      if (!started) return;
      if (!previous) previous = time;
      const dt = Math.min((time - previous) / 1000, 0.04);
      previous = time;
      for (const tag of tags.values()) {
        const w = tag.el.offsetWidth, h = tag.el.offsetHeight;
        const limitX = Math.max(0, innerWidth - w), limitY = Math.max(0, innerHeight - h);
        tag.x += tag.vx * dt; tag.y += tag.vy * dt;
        if (tag.x <= 0) { tag.x = 0; tag.vx = Math.abs(tag.vx); }
        if (tag.x >= limitX) { tag.x = limitX; tag.vx = -Math.abs(tag.vx); }
        if (tag.y <= 0) { tag.y = 0; tag.vy = Math.abs(tag.vy); }
        if (tag.y >= limitY) { tag.y = limitY; tag.vy = -Math.abs(tag.vy); }
        if (Math.random() < 0.004) { const a = Math.random() * Math.PI * 2, speed = 55 + Math.random() * 90; tag.vx = Math.cos(a) * speed; tag.vy = Math.sin(a) * speed; }
        tag.el.style.transform = `translate(${tag.x}px, ${tag.y}px)`;
      }
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      for (const tag of tags.values()) {
        tag.x = Math.min(tag.x, Math.max(0, innerWidth - tag.el.offsetWidth));
        tag.y = Math.min(tag.y, Math.max(0, innerHeight - tag.el.offsetHeight));
      }
    });

    setInterval(() => {
      const today = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
      if (today === lastRewardDate) return;
      lastRewardDate = today;
      for (const state of nameElements.values()) renderName(state.row);
      if (currentRewardUsername) {
        const state = nameElements.get(currentRewardUsername);
        if (state && rewardPanel.style.display !== 'none') showDailyReward(state.row);
      }
    }, 60000);

    input.focus();
  </script>
</body>
</html>
